name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security scans on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # NOTE: CodeQL analysis is now handled in consolidated-ci.yml
  # This workflow focuses on dependency security and SAST

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        submodules: recursive

    - name: Dependency Review
      uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5
      with:
        fail-on-severity: moderate
        allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, GPL-3.0

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit bandit semgrep

    # Audits what a fresh install resolves from the requirements files.
    # Blocking: a release must not ship with a known-vulnerable dependency.
    - name: Run pip-audit (dependency vulnerabilities)
      run: |
        pip-audit -r requirements.txt -r requirements-tui.txt -r requirements-test.txt \
          -f json -o pip-audit-report.json || true
        pip-audit -r requirements.txt -r requirements-tui.txt -r requirements-test.txt

    - name: Run Bandit (code security issues)
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -f sarif -o bandit-report.sarif || true
        bandit -r src/ || echo "Bandit found security issues - check report"
      continue-on-error: true

    - name: Upload Bandit SARIF
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      if: always()
      with:
        sarif_file: bandit-report.sarif
        category: bandit
      continue-on-error: true

    - name: Run Semgrep (SAST)
      run: |
        semgrep --config=auto src/ --json --output=semgrep-report.json || true
        semgrep --config=auto src/ --sarif --output=semgrep-report.sarif || true
        semgrep --config=auto src/ || echo "Semgrep found issues - check report"
      continue-on-error: true

    - name: Upload Semgrep SARIF
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      if: always()
      with:
        sarif_file: semgrep-report.sarif
        category: semgrep
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always()
      with:
        name: security-reports
        path: |
          pip-audit-report.json
          bandit-report.json
          bandit-report.sarif
          semgrep-report.json
          semgrep-report.sarif
        retention-days: 30
